plugins {
    alias(libs.plugins.android.library)
}

android {
    namespace 'team.techtigers.lib'
    compileSdk 34

    defaultConfig {
        minSdk 24

        testInstrumentationRunner "androidx.test.runner.AndroidJUnitRunner"
        consumerProguardFiles "consumer-rules.pro"
    }

    buildTypes {
        release {
            minifyEnabled false
            proguardFiles getDefaultProguardFile('proguard-android-optimize.txt'), 'proguard-rules.pro'
        }
    }
    compileOptions {
        sourceCompatibility JavaVersion.VERSION_1_8
        targetCompatibility JavaVersion.VERSION_1_8
    }
}

dependencies {
    testImplementation libs.junit.jupiter
    testImplementation libs.junit.jupiter.params
    testImplementation libs.mockito.core
    implementation libs.ftcrobotcore
    api 'com.pedropathing:ftc:2.1.2'
    api 'com.pedropathing:telemetry:1.0.0'
    api 'org.firstinspires.ftc:Hardware:11.1.0'
    api 'androidx.annotation:annotation:1.10.0'
}

tasks.withType(Test).configureEach {
    useJUnitPlatform()
}